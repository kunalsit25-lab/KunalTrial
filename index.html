<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Sonune</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .app {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;
            display: flex;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        }

        .sidebar {
            width: 230px;
            background: #0b1220;
            padding: 35px 22px;
            border-right: 1px solid #263244;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 45px;
        }

        .logo span {
            color: #38bdf8;
        }

        .menu p {
            color: #7f8ca3;
            font-size: 13px;
            margin: 20px 10px 10px;
        }

        .menu button {
            width: 100%;
            padding: 13px;
            margin: 4px 0;
            background: transparent;
            color: #cbd5e1;
            border: none;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover,
        .menu .active {
            background: #172338;
            color: #38bdf8;
        }

        .main {
            flex: 1;
            padding: 38px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top h1 {
            font-size: 30px;
        }

        .top p {
            color: #7f8ca3;
            margin-top: 8px;
        }

        .date {
            color: #38bdf8;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 35px 0 25px;
        }

        .stat {
            background: #172033;
            border: 1px solid #263244;
            padding: 20px;
            border-radius: 15px;
        }

        .stat small {
            color: #7f8ca3;
        }

        .stat h2 {
            margin-top: 8px;
            font-size: 28px;
        }

        .progress {
            margin-top: 12px;
            height: 5px;
            background: #273449;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress div {
            width: 35%;
            height: 100%;
            background: #38bdf8;
        }

        .add-box {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .add-box input {
            flex: 1;
            padding: 16px;
            background: #0b1220;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .add-box input:focus {
            border-color: #38bdf8;
        }

        .add-box button {
            padding: 0 25px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #07111f;
            font-weight: bold;
            cursor: pointer;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .section-title span {
            color: #64748b;
            font-size: 13px;
        }

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task {
            display: flex;
            align-items: center;
            padding: 17px;
            background: #151f30;
            border: 1px solid #263244;
            border-radius: 13px;
            transition: 0.2s;
        }

        .task:hover {
            transform: translateX(4px);
            border-color: #38bdf8;
        }

        .task input {
            width: 18px;
            height: 18px;
            margin-right: 15px;
            accent-color: #38bdf8;
        }

        .task-name {
            flex: 1;
            color: #dbeafe;
        }

        .delete {
            border: none;
            background: #2a1820;
            color: #fb7185;
            padding: 8px 11px;
            border-radius: 8px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: #64748b;
        }

        @media(max-width: 750px) {
            .sidebar {
                display: none;
            }

            .main {
                padding: 25px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .top {
                display: block;
            }

            .date {
                display: block;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <div class="logo">Task<span>Flow</span></div>

            <div class="menu">
                <p>WORKSPACE</p>

                <button class="active">◉ My Tasks</button>
                <button>★ Important</button>
                <button>✓ Completed</button>

                <p>LISTS</p>

                <button>▸ College</button>
                <button>▸ Personal</button>
                <button>▸ Projects</button>
            </div>
        </aside>


        <main class="main">

            <div class="top">
                <div>
                    <h1>My Tasks</h1>
                    <p>Plan your day. Finish what matters.</p>
                </div>

                <div class="date">Wednesday, 7 October</div>
            </div>


            <div class="stats">

                <div class="stat">
                    <small>Total Tasks</small>
                    <h2 id="total">3</h2>
                </div>

                <div class="stat">
                    <small>Completed</small>
                    <h2 id="done">0</h2>
                </div>

                <div class="stat">
                    <small>Progress</small>
                    <h2 id="percent">0%</h2>

                    <div class="progress">
                        <div id="bar"></div>
                    </div>
                </div>

            </div>


            <div class="add-box">
                <input id="taskInput" type="text"
                    placeholder="Add a new task...">

                <button onclick="addTask()">Add Task</button>
            </div>


            <div class="section-title">
                <h3>Today's Tasks</h3>
                <span id="count">3 tasks</span>
            </div>


            <div class="tasks" id="taskList">

                <div class="task">
                    <input type="checkbox" onchange="updateTasks()">
                    <span class="task-name">Complete DSA assignment</span>
                    <button class="delete" onclick="removeTask(this)">×</button>
                </div>

                <div class="task">
                    <input type="checkbox" onchange="updateTasks()">
                    <span class="task-name">Practice Java OOP</span>
                    <button class="delete" onclick="removeTask(this)">×</button>
                </div>

                <div class="task">
                    <input type="checkbox" onchange="updateTasks()">
                    <span class="task-name">Work on college project</span>
                    <button class="delete" onclick="removeTask(this)">×</button>
                </div>

            </div>

        </main>

    </div>


    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let text = input.value.trim();

            if (text === "") {
                return;
            }

            let task = document.createElement("div");

            task.className = "task";

            task.innerHTML = `
                <input type="checkbox" onchange="updateTasks()">
                <span class="task-name">${text}</span>
                <button class="delete" onclick="removeTask(this)">×</button>
            `;

            document.getElementById("taskList").appendChild(task);

            input.value = "";

            updateTasks();
        }


        function removeTask(button) {

            button.parentElement.remove();

            updateTasks();
        }


        function updateTasks() {

            let tasks = document.querySelectorAll(".task");
            let completed = 0;

            tasks.forEach(task => {

                let checkbox = task.querySelector("input");
                let name = task.querySelector(".task-name");

                if (checkbox.checked) {
                    completed++;
                    name.classList.add("completed");
                } else {
                    name.classList.remove("completed");
                }

            });

            let total = tasks.length;

            document.getElementById("total").innerText = total;
            document.getElementById("done").innerText = completed;

            let percentage = total === 0
                ? 0
                : Math.round((completed / total) * 100);

            document.getElementById("percent").innerText =
                percentage + "%";

            document.getElementById("bar").style.width =
                percentage + "%";

            document.getElementById("count").innerText =
                total + (total === 1 ? " task" : " tasks");
        }

    </script>

</body>
</html>
